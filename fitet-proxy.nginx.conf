server {
    listen 18080 default_server;
    server_name _;
    resolver 127.0.0.53 valid=300s ipv6=off;

    allow 127.0.0.1;
    allow 192.168.1.0/24;
    allow 213.158.92.214;
    deny all;

    location /archivio/ {
        set $fitet_archive archivio.fitet.org;
        rewrite ^/archivio/(.*)$ /$1 break;
        proxy_pass http://$fitet_archive;
        proxy_set_header Host archivio.fitet.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_redirect http://archivio.fitet.org/ /archivio/;
    }

    location / {
        set $fitet_portal portale.fitet.org;
        proxy_pass http://$fitet_portal;
        proxy_set_header Host portale.fitet.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_redirect https://portale.fitet.org/ /;
        proxy_redirect http://portale.fitet.org/ /;
    }
}
